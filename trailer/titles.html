<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --cobalt:#1238B8; --cobalt-lt:#5B7CFF; --pink:#FF8FB8; --gold:#C9A24A; --stone:#F5F0E8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:transparent; color:#fff; }
  #root { position:absolute; inset:0; font-family:"Inter",sans-serif; }
  .display { font-family:"Bodoni Moda",serif; font-weight:500; text-transform:uppercase; font-variation-settings:"opsz" 48; }
  .sans { font-family:"Inter",sans-serif; text-transform:uppercase; font-weight:500; }
  .mono { font-family:"JetBrains Mono",monospace; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .rule { height:2px; background:var(--gold); transform-origin:left center; }
  .mask { overflow:hidden; display:block; }
  .chip { display:inline-flex; align-items:center; gap:14px; padding:16px 26px; border:1px solid rgba(255,255,255,.28); border-radius:3px; background:rgba(8,14,40,.55); backdrop-filter:blur(6px); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--pink); box-shadow:0 0 14px var(--pink); }
  .card { border:1px solid rgba(255,255,255,.34); background:linear-gradient(180deg,rgba(18,56,184,.34),rgba(8,14,40,.72)); border-radius:4px; padding:30px 30px 26px; width:330px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeIO = (t) => { t = clamp(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
/* in over [i, i+d], out over [o-d2, o] */
const inOut = (t, i, o, d = .7, d2 = .5) => easeOut(seg(t, i, i + d)) * (1 - easeIO(seg(t, o - d2, o)));
const rise = (el, p, px = 40) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * px}px)`; };
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];

const SCENES = {
  /* Opening card on black. */
  presents: {
    dur: 3.6, bg: "#000",
    html: `<div class="center"><div class="display" id="a" style="font-size:54px;letter-spacing:.5em;text-transform:none">Dishio</div>
           <div class="sans" id="b" style="font-size:17px;letter-spacing:.8em;margin-top:30px;opacity:.8">Presents</div></div>`,
    draw(t) { rise($("#a"), inOut(t, .3, 3.5, 1.0, .6), 0); rise($("#b"), inOut(t, .9, 3.5, 1.0, .6), 0); },
  },
  /* Short white-on-black beat cards. window.ARGS = { text } */
  beat: {
    dur: 2.6, bg: "#000",
    html: () => `<div class="center"><div class="display" id="a" style="font-size:92px;letter-spacing:.24em">${ARGS.text}</div></div>`,
    draw(t) { rise($("#a"), inOut(t, .1, 2.55, .6, .35), 0); },
  },
  /* Big centred two-beat card on black. */
  evolve: {
    dur: 4.2, bg: "#000",
    html: `<div class="center"><div class="display" id="a" style="font-size:120px;letter-spacing:.22em">It&rsquo;s time</div>
           <div class="rule" id="r" style="width:120px;margin:34px 0"></div>
           <div class="display" id="b" style="font-size:120px;letter-spacing:.22em">to evolve</div></div>`,
    draw(t) { rise($("#a"), inOut(t, .2, 4.1)); $("#r").style.transform = `scaleX(${easeIO(seg(t, 1.0, 1.9))})`; $("#r").style.opacity = 1 - easeIO(seg(t, 3.6, 4.1)); rise($("#b"), inOut(t, 1.7, 4.1)); },
  },
  /* Centred overlay line over footage. */
  renowned: {
    dur: 3.4,
    html: `<div class="center" style="background:radial-gradient(60% 40% at 50% 50%,rgba(0,0,0,.45),transparent 70%)">
             <div class="sans" id="s" style="font-size:22px;letter-spacing:.6em;margin-bottom:26px">Miami</div>
             <div class="display" id="a" style="font-size:104px;letter-spacing:.2em">World-renowned</div></div>`,
    draw(t) { rise($("#s"), inOut(t, .1, 3.3), 20); rise($("#a"), inOut(t, .35, 3.3)); },
  },
  /* Lower-left feature label. window.ARGS = { title, sub } */
  label: {
    dur: 3.6,
    html: () => `<div style="position:absolute;inset:0;background:${ARGS.top ? "linear-gradient(160deg,rgba(0,0,0,.82),rgba(0,0,0,.35) 34%,transparent 56%)" : "linear-gradient(20deg,rgba(0,0,0,.86),rgba(0,0,0,.4) 32%,transparent 54%)"}" id="g"></div>
      <div style="position:absolute;left:110px;${ARGS.top ? "top:150px" : "bottom:168px"};text-shadow:0 2px 28px rgba(0,0,0,.75),0 1px 3px rgba(0,0,0,.6)">
        <div class="rule" id="r" style="width:72px;margin-bottom:26px"></div>
        <span class="mask"><div class="display" id="a" style="font-size:58px;letter-spacing:.16em;line-height:1.1">${ARGS.title}</div></span>
        <span class="mask" style="margin-top:16px"><div class="sans" id="b" style="font-size:19px;letter-spacing:.42em;opacity:.9">${ARGS.sub || ""}</div></span>
      </div>`,
    draw(t) {
      const out = 1 - easeIO(seg(t, 3.0, 3.6));
      $("#g").style.opacity = easeOut(seg(t, 0, .6)) * out;
      $("#r").style.transform = `scaleX(${easeIO(seg(t, .1, .8))})`; $("#r").style.opacity = out;
      $("#a").style.transform = `translateY(${(1 - easeOut(seg(t, .3, 1.1))) * 110}%)`; $("#a").style.opacity = out;
      $("#b").style.transform = `translateY(${(1 - easeOut(seg(t, .6, 1.4))) * 120}%)`; $("#b").style.opacity = out * .9;
    },
  },
  /* Dishio: headline. */
  d1: {
    dur: 6.4,
    html: `<div class="center" style="background:rgba(3,6,20,.5)">
      <div class="sans" id="s" style="font-size:20px;letter-spacing:.6em;color:var(--pink);margin-bottom:34px">Fully integrated with</div>
      <div class="display" id="a" style="font-size:150px;letter-spacing:.14em;text-transform:none">Dishio</div>
      <div class="rule" id="r" style="width:140px;margin:40px 0 34px"></div>
      <div class="sans" id="b" style="font-size:26px;letter-spacing:.5em">Your restaurant&rsquo;s AI growth engine</div></div>`,
    draw(t) { rise($("#s"), inOut(t, .2, 6.3), 20); rise($("#a"), inOut(t, .6, 6.3)); $("#r").style.transform = `scaleX(${easeIO(seg(t, 1.4, 2.3))})`; $("#r").style.opacity = 1 - easeIO(seg(t, 5.8, 6.3)); rise($("#b"), inOut(t, 2.2, 6.3), 24); },
  },
  /* Dishio: live event stream from the site. */
  d2: {
    dur: 6.2,
    html: () => {
      const ev = [["reserve_click", "header · cta"], ["booking_search", "party 6 · Wed 8:30 PM"], ["vip_intent", "VIP reservations"], ["private_event_intent", "plan an event"], ["scroll_depth", "75% · wheel viewed"], ["film_engaged", "hero · 9.3s watched"], ["instagram_click", "@kikiontheriver"], ["return_visit", "guest recognised"]];
      return `<div style="position:absolute;inset:0;background:rgba(3,6,20,.6)"></div>
      <div style="position:absolute;left:150px;top:150px">
        <div class="sans" style="font-size:19px;letter-spacing:.55em;color:var(--pink)" id="k">Capture &amp; connect</div>
        <div class="display" id="h" style="font-size:74px;letter-spacing:.12em;margin-top:22px;line-height:1.12">Every click,<br/>captured</div>
        <div class="rule" id="r" style="width:90px;margin-top:34px"></div>
        <div class="sans" id="f" style="font-size:17px;letter-spacing:.34em;margin-top:34px;opacity:.85;line-height:2">First-party data · Smart Sites<br/>Lead collection · QR capture</div>
      </div>
      <div style="position:absolute;right:150px;top:170px;width:760px" class="mono">
        ${ev.map(([n, d], i) => `<div class="ev" data-i="${i}" style="display:flex;align-items:center;gap:20px;padding:17px 24px;margin-bottom:12px;border:1px solid rgba(255,255,255,.26);border-left:3px solid var(--cobalt-lt);background:rgba(8,14,40,.8);border-radius:3px;font-size:24px">
          <span class="dot"></span><span style="color:#9DB2FF;min-width:330px">${n}</span><span style="opacity:.78;font-size:18px">${d}</span></div>`).join("")}
      </div>`;
    },
    draw(t) {
      const out = 1 - easeIO(seg(t, 5.6, 6.2));
      rise($("#k"), easeOut(seg(t, .1, .8)) * out, 16); rise($("#h"), easeOut(seg(t, .3, 1.1)) * out);
      $("#r").style.transform = `scaleX(${easeIO(seg(t, .8, 1.6))})`; $("#r").style.opacity = out; rise($("#f"), easeOut(seg(t, 1.2, 2.0)) * out * .85, 16);
      $$(".ev").forEach((el) => { const i = +el.dataset.i, p = easeOut(seg(t, .5 + i * .42, 1.0 + i * .42)) * out; el.style.opacity = p; el.style.transform = `translateX(${(1 - p) * 60}px)`; });
    },
  },
  /* Dishio: audiences built from intent. */
  d3: {
    dur: 6.6,
    html: () => {
      const a = [["VIP intent", "Opened VIP reservations", "2,140"], ["Private events", "Clicked plan an event", "860"], ["Date-night diners", "Party of 2 · Fri–Sat", "5,320"], ["Large parties", "Searched 7+ guests", "1,290"], ["Nightlife", "Watched the night film", "3,780"]];
      return `<div style="position:absolute;inset:0;background:rgba(3,6,20,.62)"></div>
      <div class="center" style="justify-content:flex-start;padding-top:120px">
        <div class="sans" id="k" style="font-size:19px;letter-spacing:.55em;color:var(--pink)">Built in real time</div>
        <div class="display" id="h" style="font-size:78px;letter-spacing:.14em;margin-top:22px">Custom audiences</div>
        <div class="rule" id="r" style="width:110px;margin-top:32px"></div>
      </div>
      <div style="position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center;gap:22px">
        ${a.map(([n, d, c], i) => `<div class="card au" data-i="${i}"><div class="sans" style="font-size:12px;letter-spacing:.34em;color:var(--pink)">Audience</div>
          <div class="display" style="font-size:30px;letter-spacing:.08em;margin-top:14px;line-height:1.15;min-height:70px">${n}</div>
          <div style="font-size:15px;opacity:.78;margin-top:10px;min-height:40px">${d}</div>
          <div class="mono" style="font-size:34px;margin-top:22px;color:#9DB2FF">${c}</div><div class="sans" style="font-size:11px;letter-spacing:.3em;opacity:.6;margin-top:6px">guests · illustrative</div></div>`).join("")}
      </div>`;
    },
    draw(t) {
      const out = 1 - easeIO(seg(t, 6.0, 6.6));
      rise($("#k"), easeOut(seg(t, .1, .8)) * out, 16); rise($("#h"), easeOut(seg(t, .3, 1.1)) * out);
      $("#r").style.transform = `scaleX(${easeIO(seg(t, .8, 1.6))})`; $("#r").style.opacity = out;
      $$(".au").forEach((el) => { const i = +el.dataset.i; rise(el, easeOut(seg(t, 1.2 + i * .35, 1.9 + i * .35)) * out, 50); });
    },
  },
  /* Dishio: generic pillar with chips. window.ARGS = { kicker, title, chips:[...], foot } */
  pillar: {
    dur: 5.4,
    html: () => `<div style="position:absolute;inset:0;background:rgba(3,6,20,.62)"></div>
      <div class="center">
        <div class="sans" id="k" style="font-size:19px;letter-spacing:.55em;color:var(--pink)">${ARGS.kicker}</div>
        <div class="display" id="h" style="font-size:76px;letter-spacing:.13em;margin-top:22px;max-width:1500px;line-height:1.14">${ARGS.title}</div>
        <div class="rule" id="r" style="width:110px;margin:34px 0 46px"></div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:1500px">
          ${ARGS.chips.map((c, i) => `<div class="chip ch sans" data-i="${i}" style="font-size:23px;letter-spacing:.24em;font-weight:600"><span class="dot" style="background:var(--cobalt-lt);box-shadow:0 0 14px var(--cobalt-lt)"></span>${c}</div>`).join("")}
        </div>
        <div class="sans" id="f" style="font-size:18px;letter-spacing:.42em;margin-top:50px;opacity:.85">${ARGS.foot || ""}</div>
      </div>`,
    draw(t) {
      const D = ARGS.dur || 5.4, out = 1 - easeIO(seg(t, D - .6, D));
      rise($("#k"), easeOut(seg(t, .1, .8)) * out, 16); rise($("#h"), easeOut(seg(t, .3, 1.1)) * out);
      $("#r").style.transform = `scaleX(${easeIO(seg(t, .8, 1.6))})`; $("#r").style.opacity = out;
      $$(".ch").forEach((el) => { const i = +el.dataset.i; rise(el, easeOut(seg(t, 1.1 + i * .22, 1.7 + i * .22)) * out, 30); });
      rise($("#f"), easeOut(seg(t, 2.6, 3.4)) * out * .85, 16);
    },
  },
  /* Close: logo, then sign-off. */
  close: {
    dur: 8.5, bg: "#000",
    html: `<div class="center">
      <img id="l" src="../public/brand/kiki-logo.svg" style="width:760px" />
      <div class="sans" id="s" style="font-size:24px;letter-spacing:.7em;margin-top:44px">On the River</div>
      <div class="rule" id="r" style="width:120px;margin:54px 0 40px"></div>
      <div class="display" id="a" style="font-size:44px;letter-spacing:.4em">Now live</div>
      <div class="sans" id="b" style="font-size:16px;letter-spacing:.5em;margin-top:30px;opacity:.75">The next era · Built by Dishio</div></div>`,
    draw(t) {
      const out = 1 - easeIO(seg(t, 7.6, 8.5));
      const p = easeOut(seg(t, .3, 1.8)); $("#l").style.opacity = p * out; $("#l").style.transform = `scale(${1.06 - p * .06})`;
      rise($("#s"), easeOut(seg(t, 1.2, 2.2)) * out, 18); $("#r").style.transform = `scaleX(${easeIO(seg(t, 3.0, 3.9))})`; $("#r").style.opacity = out;
      rise($("#a"), easeOut(seg(t, 3.4, 4.3)) * out, 24); rise($("#b"), easeOut(seg(t, 4.2, 5.1)) * out * .75, 16);
    },
  },
};

window.mount = (name, args) => { window.ARGS = args || {}; const s = SCENES[name]; if (args && args.dur) s.dur = args.dur; else if (name === 'pillar') s.dur = 5.4; document.body.style.background = s.bg || "transparent"; $("#root").innerHTML = typeof s.html === "function" ? s.html() : s.html; s.draw(0); return s.dur; };
window.draw = (name, t) => { const s = SCENES[name]; s.draw(t); if (name !== "label") $("#root").style.transform = `scale(${1 + 0.05 * (t / s.dur)})`; else $("#root").style.transform = ""; };
</script>
</body>
</html>
